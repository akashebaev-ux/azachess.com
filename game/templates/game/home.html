{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AzaChess - Play chess online."
    >

    <title>AzaChess</title>

    <link
        rel="stylesheet"
        href="{% static 'game/css/style.css' %}"
    >
</head>

<body>

    <main class="chess-page">

        <header class="page-header">
            <h1>AzaChess</h1>
            <p>Play chess online</p>
        </header>

        <section class="game-container">

            <div class="game-area">

                <div class="game-info">
                    <p>
                        Turn:
                        <strong id="turn-display">
                            White
                        </strong>
                    </p>
                </div>

                <div
                    id="chessboard"
                    class="chessboard"
                    aria-label="Chess board"
                >
                </div>

            </div>

        </section>

    </main>

    <script src="{% static 'game/js/chess.js' %}"></script>

</body>
</html>
