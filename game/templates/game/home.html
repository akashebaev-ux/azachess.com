{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AzaChess - Play chess online."
    >

    <title>AzaChess</title>

    <link
        rel="stylesheet"
        href="{% static 'game/css/style.css' %}"
    >
</head>

<body>

    <main class="chess-page">

        <header class="page-header">
            <h1>AzaChess</h1>
            <p>Premium online chess experience</p>
        </header>

        <section class="game-layout">

            <div class="board-column">

                <div class="status-bar card-panel">
                    <p>
                        Turn:
                        <strong id="turn-display">White</strong>
                    </p>
                </div>

                <div class="captured-panel card-panel">
                    <h2>Black pieces taken</h2>
                    <div id="captured-black" class="captured-pieces"></div>
                </div>

                <div class="board-frame">
                    <div
                        id="chessboard"
                        class="chessboard"
                        aria-label="Chess board"
                    ></div>
                </div>

                <div class="captured-panel card-panel">
                    <h2>White pieces taken</h2>
                    <div id="captured-white" class="captured-pieces"></div>
                </div>

            </div>

            <aside class="side-panel card-panel">

                <h2>Move History</h2>

                <div
                    id="move-history"
                    class="move-history"
                ></div>

                <div class="game-actions">

                    <div class="secondary-actions">

                        <button
                            id="draw-button"
                            class="game-button"
                            type="button"
                        >
                            Draw
                        </button>

                        <button
                            id="resign-button"
                            class="game-button danger-button"
                            type="button"
                        >
                            Resign
                        </button>

                    </div>

                    <button
                        id="new-game-button"
                        class="game-button new-game-button"
                        type="button"
                    >
                        New Game
                    </button>

                </div>

            </aside>

        </section>

    </main>

    <script src="{% static 'game/js/chess.js' %}"></script>

</body>
</html>
