{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AzaChess - Play chess online."
    >

    <title>AzaChess</title>

    <link
        rel="stylesheet"
        href="{% static 'game/css/style.css' %}"
    >
</head>

<body>

    <main class="chess-page">

        <!-- ==================================================
             PAGE HEADER
        =================================================== -->

        <header class="page-header">

            <h1>AzaChess</h1>

            <p>
                Premium online chess experience
            </p>

        </header>


        <!-- ==================================================
             GAME LAYOUT

             LEFT   = Engine Analysis
             CENTER = Chessboard
             RIGHT  = Move History
        =================================================== -->

        <section class="game-layout">


            <!-- ==============================================
                 LEFT PANEL - ENGINE ANALYSIS
            =============================================== -->

            <aside
                class="engine-panel card-panel"
                aria-labelledby="engine-analysis-title"
            >

                <div class="chess-teacher">

                    <h2 class="teacher-title">
                        Your Chess Teacher
                    </h2>

                    <div class="teacher-avatar-wrapper">

                        <img
                            id="teacher-avatar"
                            class="teacher-avatar"
                            src="{% static 'game/images/teacher/chess-teacher.png' %}"
                            alt="AzaChess virtual chess teacher"
                        >

                    </div>

                    <div
                        id="teacher-speech"
                        class="teacher-speech"
                        aria-live="polite"
                    >
                        <p id="teacher-message">
                            Welcome to AzaChess!
                            Please choose your language.
                        </p>
                    </div>


                    <!-- ==============================
                         TEACHER LANGUAGE
                    =============================== -->

                    <select
                        id="teacher-language"
                        class="teacher-language"
                        aria-label="Choose teacher language"
                    >

                        <option
                            value=""
                            selected
                            disabled
                        >
                            Choose language
                        </option>

                        <option value="en-GB">
                            English
                        </option>

                        <option value="ru-RU">
                            Русский
                        </option>

                        <option value="kk-KZ">
                            Қазақша
                        </option>

                        <option value="sv-SE">
                            Svenska
                        </option>

                    </select>


                    <!-- ==============================
                         TEACHER MICROPHONE
                    =============================== -->

                    <button
                        type="button"
                        id="teacher-microphone"
                        class="teacher-microphone"
                        aria-label="Talk to chess teacher"
                        title="Talk to your chess teacher"
                    >
                        🎤 Talk to Teacher
                    </button>

                </div>


                <h2 id="engine-analysis-title">
                    Engine Analysis
                </h2>


                <div class="engine-analysis-grid">


                    <!-- Evaluation -->

                    <div class="engine-analysis-item">

                        <span class="engine-label">
                            Evaluation
                        </span>

                        <strong
                            id="engine-evaluation"
                            class="engine-value"
                        >
                            Analysing...
                        </strong>

                    </div>


                    <!-- Best move -->

                    <div class="engine-analysis-item">

                        <span class="engine-label">
                            Best move
                        </span>

                        <strong
                            id="engine-best-move"
                            class="engine-value"
                        >
                            —
                        </strong>

                    </div>


                    <!-- Move quality -->

                    <div class="engine-analysis-item">

                        <span class="engine-label">
                            Your move
                        </span>

                        <strong
                            id="engine-move-quality"
                            class="engine-value"
                        >
                            —
                        </strong>

                    </div>


                    <!-- Engine depth -->

                    <div class="engine-analysis-item">

                        <span class="engine-label">
                            Depth
                        </span>

                        <strong
                            id="engine-depth"
                            class="engine-value"
                        >
                            —
                        </strong>

                    </div>

                </div>

            </aside>


            <!-- ==============================================
                 CENTER - CHESSBOARD
            =============================================== -->

            <div class="board-column">


                <!-- Current turn -->

                <div class="status-bar card-panel">

                    <p>
                        Turn:
                        <strong id="turn-display">
                            White
                        </strong>
                    </p>

                </div>


                <!-- Captured black pieces -->

                <div class="captured-panel card-panel">

                    <h2>
                        Black pieces taken
                    </h2>

                    <div
                        id="captured-black"
                        class="captured-pieces"
                    ></div>

                </div>


                <!-- Chessboard -->

                <div class="board-frame">

                    <div
                        id="chessboard"
                        class="chessboard"
                        aria-label="Chess board"
                    ></div>

                </div>


                <!-- Captured white pieces -->

                <div class="captured-panel card-panel">

                    <h2>
                        White pieces taken
                    </h2>

                    <div
                        id="captured-white"
                        class="captured-pieces"
                    ></div>

                </div>

            </div>


            <!-- ==============================================
                 RIGHT PANEL - MOVE HISTORY
            =============================================== -->

            <aside class="side-panel card-panel">

                <h2>
                    Move History
                </h2>


                <div
                    id="move-history"
                    class="move-history"
                ></div>


                <!-- ==========================================
                     GAME ACTIONS
                =========================================== -->

                <div class="game-actions">


                    <div class="secondary-actions">

                        <button
                            id="draw-button"
                            class="game-button"
                            type="button"
                        >
                            Draw
                        </button>


                        <button
                            id="resign-button"
                            class="game-button danger-button"
                            type="button"
                        >
                            Resign
                        </button>

                    </div>


                    <button
                        id="new-game-button"
                        class="game-button new-game-button"
                        type="button"
                    >
                        New Game
                    </button>

                </div>

            </aside>

        </section>

    </main>


    <!-- ==================================================
         GAME CONFIRMATION MODAL
    =================================================== -->

    <div
        id="game-modal"
        class="game-modal"
        aria-hidden="true"
    >

        <div
            class="game-modal-backdrop"
            id="game-modal-backdrop"
        ></div>


        <div
            class="game-modal-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="game-modal-title"
            aria-describedby="game-modal-message"
        >

            <div
                class="game-modal-icon"
                aria-hidden="true"
            >
                ♔
            </div>


            <h2 id="game-modal-title">
                Confirm
            </h2>


            <p id="game-modal-message"></p>


            <div class="game-modal-actions">


                <button
                    id="game-modal-cancel"
                    class="modal-button modal-cancel-button"
                    type="button"
                >
                    Cancel
                </button>


                <button
                    id="game-modal-confirm"
                    class="modal-button modal-confirm-button"
                    type="button"
                >
                    Confirm
                </button>

            </div>

        </div>

    </div>


    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <script
        src="{% static 'game/js/teacher-rules.js' %}"
    ></script>

    <script
        src="{% static 'game/js/teacher-explanations.js' %}"
    ></script>

    <script
        src="{% static 'game/js/chess.js' %}"
    ></script>

</body>

</html>
